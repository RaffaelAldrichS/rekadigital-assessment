services:
  - type: web
    name: automotive-marketplace-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run migrate && npm run seed && node dist/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: automotive-marketplace-db
          property: connectionString

databases:
  - name: automotive-marketplace-db
    plan: free
    databaseName: automotive_marketplace
